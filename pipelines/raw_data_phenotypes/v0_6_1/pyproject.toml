[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurothermo-current-vulnerability"
version = "0.6.1"
description = "Calibrated current-resolved vulnerability analysis for NeuroThermo"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.4",
  "matplotlib>=3.5",
  "PyYAML>=6.0",
]

[project.scripts]
neurothermo-current-vulnerability = "neurothermo_vulnerability.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
