[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurothermo-dependency-aware-fingerprint"
version = "0.5.1"
description = "Dependency-aware cell-level phenotype robustness audit for NeuroThermo"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.4",
  "matplotlib>=3.5",
  "PyYAML>=6.0",
]

[project.scripts]
neurothermo-dependency-aware = "neurothermo_cell_fingerprint.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
