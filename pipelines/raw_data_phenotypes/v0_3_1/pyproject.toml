[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurothermo-phenotypes"
version = "0.3.1"
description = "Model-free thermodynamic phenotype and WT-to-SCA3 disease-coordinate pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
abf = ["pyabf>=2.3.8"]
test = ["pytest>=7.4"]

[project.scripts]
neurothermo-phenotypes = "neurothermo_phenotypes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
