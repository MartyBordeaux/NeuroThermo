[build-system]
requires = ["setuptools>=61,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurothermo-per-cell"
version = "0.2.1"
description = "Joint per-cell fitting and identifiability diagnostics for NeuroThermo"
requires-python = ">=3.9"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.13.1",
  "PyYAML==6.0.2",
]

[project.scripts]
neurothermo-per-cell = "neurothermo_per_cell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurothermo_per_cell = ["data/*.csv"]
