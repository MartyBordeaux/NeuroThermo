[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurothermo-transition-reprojection"
version = "1.1.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "pandas>=1.3", "PyYAML>=5.4", "matplotlib>=3.4"]

[tool.setuptools]
packages = ["transition_v1_1"]
