analysis:
  name: kl_convergence
  role: server_full_ensemble
cohort:
  mode: core_secure_all_support
  max_scenarios: null
  scenario_ids: null
path: {n_p: 31}
model: {a: 1.0, c: 1.0, d: 5.0, x_R: -1.6, x0: -1.6, y0: -10.0, z0: 1.0, model_time_scale_ms: 1.0}
noise: {D: [0.0025, 0.01, 0.00025], multiplier: 1.0}
stationary: {burn_ms: 2400.0, sample_ms: 6000.0, sample_stride_ms: 0.5}
density: {bins: 22, grid_strategy: all_task_extrema, coverage_margin_fraction: 0.02, required_retention: 1.0, retention_tolerance: 1.0e-12, gaussian_sigma_bins: 1.0, pseudocount: 1.0e-10}
convergence:
