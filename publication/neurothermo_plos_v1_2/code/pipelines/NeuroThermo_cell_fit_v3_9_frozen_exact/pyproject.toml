[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-cell-fit"
version = "3.9.0"
description = "Global s-boundary-stress four-parameter joint multi-sweep Hindmarsh-Rose cell fitter v3.9 for NeuroThermo"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
  "numba>=0.57",
  "PyYAML>=6.0",
  "matplotlib>=3.6"
]

[project.scripts]
hr-cell-fit = "hr_cell_fit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hr_cell_fit*"]
