name: Import exact transition v1.3 source from server

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/import_transition_v1_3_source.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          SRC=/home/github-runner/neurothermo_transition_v1_3_source_2026-08-31.tar.gz
          test -r "$SRC"
          echo "SOURCE_ARCHIVE=$SRC" >> "$GITHUB_ENV"
          sha256sum "$SRC"
          tar -tzf "$SRC" > /tmp/v13_source_contents.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/v13_source_contents.txt; then
            echo 'Unsafe archive member path detected' >&2
            exit 1
          fi
      - name: Extract exact source tree
        shell: bash
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          tar -xzf "$SOURCE_ARCHIVE" -C "$TMP"
          SRCROOT="$TMP/neurothermo/v4/neurothermo_transition_ensemble_v1_3"
          test -d "$SRCROOT/transition_v1_3"
          test -f "$SRCROOT/transition_v1_3/cli.py"
          test -f "$SRCROOT/transition_v1_3/decomposition.py"
          test -d "$SRCROOT/configs"

          ROOT="$GITHUB_WORKSPACE/publication/neurothermo_plos_v1_2"
          DEST="$ROOT/code/pipelines/NeuroThermo_transition_v1_3_frozen_exact"
          rm -rf "$DEST"
          mkdir -p "$DEST" "$ROOT/docs" "$ROOT/data/upstream_server_bundle"
          cp -a "$SRCROOT/." "$DEST/"
          rm -rf "$DEST/results_transition_ensemble_v1_3" "$DEST/.venv" "$DEST/venv"
          find "$DEST" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find "$DEST" -type f -name '*.pyc' -delete

          sha256sum "$SOURCE_ARCHIVE" > "$ROOT/data/upstream_server_bundle/TRANSITION_V1_3_SOURCE_ARCHIVE_SHA256.txt"
          cp /tmp/v13_source_contents.txt "$ROOT/data/upstream_server_bundle/TRANSITION_V1_3_SOURCE_ARCHIVE_CONTENTS.txt"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('publication/neurothermo_plos_v1_2')
          tree=root/'code/pipelines/NeuroThermo_transition_v1_3_frozen_exact'
          files=sorted(p for p in tree.rglob('*') if p.is_file())
          h=hashlib.sha256()
          manifest=['relative_path\tsize_bytes\tsha256']
          for p in files:
              rel=p.relative_to(tree).as_posix(); data=p.read_bytes()
              ph=hashlib.sha256(data).hexdigest()
              manifest.append(f'{rel}\t{len(data)}\t{ph}')
              rb=rel.encode()
              h.update(len(rb).to_bytes(8,'big')); h.update(rb)
              h.update(len(data).to_bytes(8,'big')); h.update(data)
          (root/'docs/TRANSITION_V1_3_EXACT_SOURCE_MANIFEST.tsv').write_text('\n'.join(manifest)+'\n')
          meta={'source_server_path':'/root/neurothermo/v4/neurothermo_transition_ensemble_v1_3','publication_tree':str(tree.relative_to(root)),'file_count':len(files),'deterministic_tree_sha256':h.hexdigest(),'required_decomposition_present':(tree/'transition_v1_3/decomposition.py').is_file()}
          (root/'docs/TRANSITION_V1_3_EXACT_SOURCE_PROVENANCE.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY
          python3 -m compileall -q "$DEST"
      - name: Commit exact server source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_transition_v1_3_frozen_exact \
            publication/neurothermo_plos_v1_2/docs/TRANSITION_V1_3_EXACT_SOURCE_MANIFEST.tsv \
            publication/neurothermo_plos_v1_2/docs/TRANSITION_V1_3_EXACT_SOURCE_PROVENANCE.json \
            publication/neurothermo_plos_v1_2/data/upstream_server_bundle/TRANSITION_V1_3_SOURCE_ARCHIVE_SHA256.txt \
            publication/neurothermo_plos_v1_2/data/upstream_server_bundle/TRANSITION_V1_3_SOURCE_ARCHIVE_CONTENTS.txt
          git diff --cached --quiet || {
            git commit -m 'Import exact transition v1.3 source from server'
            git push origin HEAD:publication/plos-v1.2
          }
