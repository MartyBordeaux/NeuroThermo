name: Audit publication path portability

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/audit_publication_paths.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan pipeline sources and configs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import re
          from pathlib import Path

          root = Path('publication/neurothermo_plos_v1_2')
          code = root / 'code' / 'pipelines'
          out = root / 'docs' / 'PORTABILITY_AUDIT.tsv'
          summary = root / 'docs' / 'PORTABILITY_AUDIT.md'

          text_ext = {'.py','.sh','.yaml','.yml','.toml','.txt','.md','.json','.csv','.ini','.cfg','.r','.R'}
          checks = [
              ('ABS_ROOT', re.compile(r'/root/[^\s\"\'`]+')),
              ('ABS_HOME', re.compile(r'/home/[^\s\"\'`]+')),
              ('TILDE_HOME', re.compile(r'~/[^\s\"\'`]+')),
              ('PARENT_REL', re.compile(r'(?<!\.)\.\./[^\s\"\'`]+')),
              ('ZIP_DEP', re.compile(r'[^\s\"\'`]*\.zip(?:/[^\s\"\'`]*)?')),
              ('OLD_SERVER_TREE', re.compile(r'(?:neurothermo/v\d+|results_stage\w*|whole_cell_current_clamp)[^\s\"\'`]*')),
          ]

          rows=[]
          scanned=0
          for p in sorted(code.rglob('*')):
              if not p.is_file() or p.suffix not in text_ext:
                  continue
              try:
                  text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              scanned += 1
              rel=p.relative_to(root).as_posix()
              package=rel.split('/')[2] if rel.startswith('code/pipelines/') and len(rel.split('/'))>2 else ''
              for lineno,line in enumerate(text.splitlines(),1):
                  for category,rx in checks:
                      for m in rx.finditer(line):
                          rows.append({
                              'package': package,
                              'file': rel,
                              'line': lineno,
                              'category': category,
                              'match': m.group(0),
                              'context': line.strip()[:500],
                          })

          out.parent.mkdir(parents=True,exist_ok=True)
          with out.open('w',encoding='utf-8',newline='') as fh:
              w=csv.DictWriter(fh,fieldnames=['package','file','line','category','match','context'],delimiter='\t')
              w.writeheader(); w.writerows(rows)

          by_pkg={}
          by_cat={}
          for r in rows:
              by_pkg[r['package']]=by_pkg.get(r['package'],0)+1
              by_cat[r['category']]=by_cat.get(r['category'],0)+1
          lines=[
              '# Publication path portability audit','',
              f'Scanned text files: {scanned}',
              f'Potential path/dependency findings: {len(rows)}','',
              'This report is a lexical audit. A finding is not automatically an error: README examples and historical validation notes may intentionally contain old paths. Executable configs, scripts, and Python code must be portable in the final release.','',
              '## Findings by package',''
          ]
          for k,v in sorted(by_pkg.items(),key=lambda x:(-x[1],x[0])):
              lines.append(f'- `{k}`: {v}')
          lines += ['','## Findings by category','']
          for k,v in sorted(by_cat.items(),key=lambda x:(-x[1],x[0])):
              lines.append(f'- `{k}`: {v}')
          lines += ['','See `PORTABILITY_AUDIT.tsv` for exact file, line, matched path, and line context.','']
          summary.write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publication/neurothermo_plos_v1_2/docs/PORTABILITY_AUDIT.tsv publication/neurothermo_plos_v1_2/docs/PORTABILITY_AUDIT.md
          git diff --cached --quiet || { git commit -m 'Audit publication pipeline path portability'; git push origin HEAD:publication/plos-v1.2; }
