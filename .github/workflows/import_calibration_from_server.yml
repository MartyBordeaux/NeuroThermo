name: Import calibration bundle from NeuroThermo server

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/import_calibration_from_server.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Locate exact server archive
        shell: bash
        run: |
          set -euo pipefail
          NAME='neurothermo_publication_calibration_bundle_2026-08-31.tar.gz'
          CANDIDATES=(
            "/root/$NAME"
            "$HOME/$NAME"
          )
          SRC=''
          for p in "${CANDIDATES[@]}"; do
            if [ -f "$p" ]; then SRC="$p"; break; fi
          done
          if [ -z "$SRC" ]; then
            SRC="$(find /root /home -maxdepth 4 -type f -name "$NAME" -print -quit 2>/dev/null || true)"
          fi
          test -n "$SRC" && test -f "$SRC"
          echo "CAL_SRC=$SRC" >> "$GITHUB_ENV"
          sha256sum "$SRC"
      - name: Copy exact archive into publication release
        shell: bash
        run: |
          set -euo pipefail
          DEST='publication/neurothermo_plos_v1_2/data/calibration_bundle'
          mkdir -p "$DEST"
          cp "$CAL_SRC" "$DEST/neurothermo_publication_calibration_bundle_2026-08-31.tar.gz"
          sha256sum "$DEST/neurothermo_publication_calibration_bundle_2026-08-31.tar.gz" > "$DEST/SERVER_ARCHIVE_SHA256.txt"
          cat "$DEST/SERVER_ARCHIVE_SHA256.txt"
      - name: Commit exact binary calibration bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publication/neurothermo_plos_v1_2/data/calibration_bundle/neurothermo_publication_calibration_bundle_2026-08-31.tar.gz publication/neurothermo_plos_v1_2/data/calibration_bundle/SERVER_ARCHIVE_SHA256.txt
          git diff --cached --quiet || { git commit -m 'Import exact calibration bundle from server'; git push origin HEAD:publication/plos-v1.2; }
