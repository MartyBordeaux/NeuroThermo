name: Audit publication figure-source lineage

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/audit_figure_source_lineage.yml
      - publication/neurothermo_plos_v1_2/code/audit_figure_source_lineage.py
      - publication/neurothermo_plos_v1_2/data/figure_source/**
      - publication/neurothermo_plos_v1_2/data/endpoint_ensemble_v1_0_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_1_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_2_1_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_3_results/**

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install audit dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Audit figure-source lineage
        run: python publication/neurothermo_plos_v1_2/code/audit_figure_source_lineage.py
      - name: Commit lineage report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publication/neurothermo_plos_v1_2/docs/FIGURE_SOURCE_LINEAGE_AUDIT.json
          git diff --cached --quiet || {
            git commit -m 'Record figure-source lineage audit'
            git push origin HEAD:publication/plos-v1.2
          }
