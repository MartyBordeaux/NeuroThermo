name: Publication figure-source preflight

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/preflight_figure_source.yml
      - publication/neurothermo_plos_v1_2/code/**
      - publication/neurothermo_plos_v1_2/data/figure_source/**
      - publication/neurothermo_plos_v1_2/data/raw/**
      - publication/neurothermo_plos_v1_2/data/endpoint_ensemble_v1_0_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_1_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_2_1_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_3_results/**
      - publication/neurothermo_plos_v1_2/data/kl_convergence_v1_0_1/**
      - publication/neurothermo_plos_v1_2/data/nonequilibrium_geometry_v1_0_1/**

permissions:
  contents: read

jobs:
  figure-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install exact relevant environment
        run: python -m pip install numpy==1.26.4 pandas==2.2.3 pyabf==2.3.8 matplotlib==3.9.4
      - name: Rebuild and validate Fig1-3 source tables
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh figure-source
      - name: Remove committed render outputs before replay
        run: |
          rm -f publication/neurothermo_plos_v1_2/results/figures/Fig1_endpoint_phenotype.pdf
          rm -f publication/neurothermo_plos_v1_2/results/figures/Fig2_transition_staging.pdf
          rm -f publication/neurothermo_plos_v1_2/results/figures/Fig3_intrinsic_drive_decomposition.pdf
          rm -f publication/neurothermo_plos_v1_2/results/figures/Fig4_thermodynamic_information_geometry.pdf
          rm -f publication/neurothermo_plos_v1_2/results/figures/Fig5_nonequilibrium_geometry.pdf
          rm -f publication/neurothermo_plos_v1_2/results/figures/FigS1_support_restricted_dynamics.pdf
          rm -f publication/neurothermo_plos_v1_2/results/figures/FigS2_multiseed_marker_robustness.pdf
      - name: Render canonical Python figures from release data
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh figures-python
      - name: Assert freshly rendered publication files exist
        run: |
          test -s publication/neurothermo_plos_v1_2/results/figures/Fig1_endpoint_phenotype.pdf
          test -s publication/neurothermo_plos_v1_2/results/figures/Fig2_transition_staging.pdf
          test -s publication/neurothermo_plos_v1_2/results/figures/Fig3_intrinsic_drive_decomposition.pdf
          test -s publication/neurothermo_plos_v1_2/results/figures/Fig4_thermodynamic_information_geometry.pdf
          test -s publication/neurothermo_plos_v1_2/results/figures/Fig5_nonequilibrium_geometry.pdf
          test -s publication/neurothermo_plos_v1_2/results/figures/FigS1_support_restricted_dynamics.pdf
          test -s publication/neurothermo_plos_v1_2/results/figures/FigS2_multiseed_marker_robustness.pdf
