name: Publication figure-source preflight

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/preflight_figure_source.yml
      - publication/neurothermo_plos_v1_2/**

permissions:
  contents: read

jobs:
  figure-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install exact relevant environment
        run: python -m pip install numpy==1.26.4 pandas==2.2.3 pyabf==2.3.8 matplotlib==3.9.4
      - name: Rebuild and validate publication source tables
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh figure-source
      - name: Remove all committed figure renders before replay
        shell: bash
        run: |
          set -euo pipefail
          find publication/neurothermo_plos_v1_2/results/figures -maxdepth 1 -type f \( -name 'Fig*.pdf' -o -name 'Fig*.png' \) -delete
      - name: Render canonical Python figures from release data
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh figures-python
      - name: Assert exact 16-file frozen figure contract
        shell: bash
        run: |
          set -euo pipefail
          DIR=publication/neurothermo_plos_v1_2/results/figures
          stems=(
            Fig1_endpoint_phenotype
            Fig2_transition_staging
            Fig3_intrinsic_drive_decomposition
            Fig4_thermodynamic_information_geometry
            Fig5_nonequilibrium_geometry
            FigS1_support_restricted_dynamics
            FigS2_multiseed_marker_robustness
            FigS3_KL_full_coverage_convergence
          )
          expected=$(mktemp)
          actual=$(mktemp)
          for stem in "${stems[@]}"; do
            for ext in pdf png; do
              f="$DIR/$stem.$ext"
              test -s "$f"
              printf '%s\n' "$stem.$ext" >> "$expected"
            done
          done
          find "$DIR" -maxdepth 1 -type f \( -name 'Fig*.pdf' -o -name 'Fig*.png' \) -printf '%f\n' | sort > "$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          test "$(wc -l < "$actual")" -eq 16
          echo FIGURE_CONTRACT_16_FILES_PASS
