name: Publication clean-clone preflight

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/preflight_publication_release.yml
      - publication/neurothermo_plos_v1_2/environment/**
      - publication/neurothermo_plos_v1_2/code/prepare_calibration.py
      - publication/neurothermo_plos_v1_2/code/prepare_upstream_inputs.py
      - publication/neurothermo_plos_v1_2/code/preflight_release.py
      - publication/neurothermo_plos_v1_2/code/validate_raw_data.py
      - publication/neurothermo_plos_v1_2/code/validate_transition_frozen.py
      - publication/neurothermo_plos_v1_2/code/validate_transition_results.py
      - publication/neurothermo_plos_v1_2/code/run_qc_publication.sh
      - publication/neurothermo_plos_v1_2/code/run_full_analyses.sh
      - publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_stage1_qc_fixed/**
      - publication/neurothermo_plos_v1_2/data/qc/**
      - publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_cell_fit_v3_9_frozen_exact/**
      - publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_dynamic_v2_1/**
      - publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_endpoint_ensemble_v1_0_1/**
      - publication/neurothermo_plos_v1_2/data/calibration_bundle/**
      - publication/neurothermo_plos_v1_2/data/upstream_server_bundle/**
      - publication/neurothermo_plos_v1_2/data/raw/**
      - publication/neurothermo_plos_v1_2/docs/RAW_DATA_MANIFEST.tsv
      - publication/neurothermo_plos_v1_2/data/endpoint_ensemble_v1_0_frozen/**
      - publication/neurothermo_plos_v1_2/data/endpoint_ensemble_v1_0_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_0_frozen/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_1_frozen/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_2_frozen/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_3_frozen/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_0_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_1_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_2_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_2_1_results/**
      - publication/neurothermo_plos_v1_2/data/transition_v1_3_results/**

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install historical publication environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r publication/neurothermo_plos_v1_2/environment/requirements-python39-historical.txt
          python -m pip install -e publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_endpoint_ensemble_v1_0_1 --no-deps
          python - <<'PY'
          import numpy, pandas, scipy, sklearn, matplotlib, pyabf, statsmodels
          expected={
            'numpy':'1.26.4','pandas':'2.2.3','scipy':'1.13.1','sklearn':'1.6.1',
            'matplotlib':'3.9.4','pyabf':'2.3.8','statsmodels':'0.14.6'
          }
          got={
            'numpy':numpy.__version__,'pandas':pandas.__version__,'scipy':scipy.__version__,
            'sklearn':sklearn.__version__,'matplotlib':matplotlib.__version__,
            'pyabf':pyabf.__version__,'statsmodels':statsmodels.__version__
          }
          print(got)
          assert got == expected
          PY
      - name: Validate raw ABF recordings and manifest
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh raw-integrity
      - name: Test final fixed-QC implementation
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh qc-tests
      - name: Recompute raw ABF to fixed-QC outputs
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh qc-recompute
      - name: Compare recomputed QC to frozen historical output
        run: |
          python publication/neurothermo_plos_v1_2/code/prepare_calibration.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, pandas as pd
          root=Path('publication/neurothermo_plos_v1_2')
          newp=root/'results/recomputed/stage1_qc_fixed/00_calibration/candidate_events_with_predictions.csv'
          refp=root/'data/calibration/candidate_events_with_predictions.csv'
          new=pd.read_csv(newp)
          ref=pd.read_csv(refp)
          print('candidate_rows', len(new))
          print('fixed_qc_detected', int(new['fixed_qc_detected'].sum()))
          print('raw_sha256', hashlib.sha256(newp.read_bytes()).hexdigest())
          assert len(new) == 6800
          assert int(new['fixed_qc_detected'].sum()) == 6039
          assert len(ref) == 6800
          # Absolute abf_path is machine-specific; compare all scientific columns exactly.
          cols=[c for c in ref.columns if c != 'abf_path']
          assert cols == [c for c in new.columns if c != 'abf_path']
          pd.testing.assert_frame_equal(
              new[cols].reset_index(drop=True),
              ref[cols].reset_index(drop=True),
              check_dtype=False,
              check_exact=True,
          )
          print('QC_SCIENTIFIC_COLUMNS_EXACT_MATCH')
          PY
      - name: Prepare, hash-check and validate exact v3.9 bundle
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh cellfit-validate
      - name: Prepare, hash-check and validate dynamic-v2.1 frozen layer
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh dynamic-validate
      - name: Validate endpoint-v1.0.1 frozen layer
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh endpoint-validate
      - name: Validate exact transition frozen inputs
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh transition-frozen
      - name: Validate imported transition result chain
        run: bash publication/neurothermo_plos_v1_2/code/run_full_analyses.sh transition-integrity
