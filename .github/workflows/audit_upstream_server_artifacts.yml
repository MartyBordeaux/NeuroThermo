name: Audit upstream server artifacts

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/audit_upstream_server_artifacts.yml

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - name: Check server access and locate publication-critical upstream artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$(whoami) home=$HOME host=$(hostname)"
          echo "sudo_test:"
          sudo -n true && echo "SUDO_NOPASSWD=YES" || echo "SUDO_NOPASSWD=NO"
          echo "-- candidate directories/files --"
          if sudo -n true 2>/dev/null; then
            sudo find /root/neurothermo -maxdepth 7 \( \
              -type d \( -name 'results_cellfit_v3_9' -o -name 'frozen' -o -name 'results_dynamic_v2_1' -o -name 'results_endpoint_ensemble_v1_0*' -o -name 'results_transition_ensemble_v1_*' \) -o \
              -type f \( -name 'NeuroThermo_animal_id_recovery.xlsx' -o -name 'cell_fit_summary.csv' -o -name 'sweep_fit_summary.csv' -o -name 'final_identifiability_alternatives.csv' -o -name 'primary_cell_master.csv' -o -name 'accepted_spiking_sweeps.csv' -o -name 'selected_spike_events.csv' -o -name 'animal_id_map.csv' \) \
            \) -print 2>/dev/null | sort | head -n 500
          else
            find /home -maxdepth 7 \( \
              -type d \( -name 'results_cellfit_v3_9' -o -name 'frozen' -o -name 'results_dynamic_v2_1' -o -name 'results_endpoint_ensemble_v1_0*' -o -name 'results_transition_ensemble_v1_*' \) -o \
              -type f \( -name 'NeuroThermo_animal_id_recovery.xlsx' -o -name 'cell_fit_summary.csv' -o -name 'sweep_fit_summary.csv' -o -name 'final_identifiability_alternatives.csv' -o -name 'primary_cell_master.csv' -o -name 'accepted_spiking_sweeps.csv' -o -name 'selected_spike_events.csv' -o -name 'animal_id_map.csv' \) \
            \) -print 2>/dev/null | sort | head -n 500
          fi
