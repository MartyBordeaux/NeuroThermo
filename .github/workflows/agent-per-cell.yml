name: Agent-dispatched per-cell pipeline

on:
  push:
    branches: [main]
    paths:
      - agent-dispatch/request.json

permissions:
  contents: read

jobs:
  validate-request:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.request.outputs.enabled }}
      profile: ${{ steps.request.outputs.profile }}
      resume: ${{ steps.request.outputs.resume }}
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        name: Validate dispatch request
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          request = json.loads(Path("agent-dispatch/request.json").read_text())
          enabled = request.get("enabled")
          profile = request.get("profile")
          resume = request.get("resume")
          request_id = request.get("request_id")

          if not isinstance(enabled, bool):
              raise SystemExit("'enabled' must be boolean")
          if profile not in {"smoke", "preliminary", "full"}:
              raise SystemExit("profile must be smoke, preliminary, or full")
          if not isinstance(resume, bool):
              raise SystemExit("'resume' must be boolean")
          if not isinstance(request_id, str) or not request_id:
              raise SystemExit("'request_id' must be a non-empty string")

          print(f"enabled={str(enabled).lower()}")
          print(f"profile={profile}")
          print(f"resume={str(resume).lower()}")
          print(f"request_id={request_id}")
          PY

  run:
    needs: validate-request
    if: needs.validate-request.outputs.enabled == 'true'
    runs-on: [self-hosted, neurothermo-vps]
    timeout-minutes: 10080
    concurrency:
      group: neurothermo-per-cell-${{ needs.validate-request.outputs.profile }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Stage protected benchmark
        env:
          NEUROTHERMO_BENCHMARK: ${{ vars.NEUROTHERMO_BENCHMARK }}
        run: |
          benchmark="${NEUROTHERMO_BENCHMARK:-/root/neurothermo/v2/per_cell_pipeline/src/neurothermo_per_cell/data/frozen_v2_w20_observations.csv}"
          destination="src/neurothermo_per_cell/data/frozen_v2_w20_observations.csv"
          mkdir -p src/neurothermo_per_cell/data
          if [ -r "$benchmark" ]; then
            install -m 600 "$benchmark" "$destination"
          elif command -v sudo >/dev/null && sudo -n test -r "$benchmark"; then
            sudo -n install -o "$(id -u)" -g "$(id -g)" -m 600 "$benchmark" "$destination"
          else
            echo "Benchmark is not readable by the runner: $benchmark" >&2
            exit 1
          fi

      - name: Prepare Python environment
        run: |
          python3 --version
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade "pip<26" "setuptools<76" wheel
          python -m pip install -e .
          python -m pip check

      - name: Validate benchmark
        run: |
          . .venv/bin/activate
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run selected profile
        run: |
          . .venv/bin/activate
          args="--config configs/${{ needs.validate-request.outputs.profile }}.yaml"
          if [ "${{ needs.validate-request.outputs.resume }}" = "true" ]; then args="$args --resume"; fi
          PYTHONPATH=src python -m neurothermo_per_cell.cli run $args

      - name: Remove staged benchmark
        if: always()
        run: rm -f src/neurothermo_per_cell/data/frozen_v2_w20_observations.csv

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-per-cell-${{ needs.validate-request.outputs.profile }}-${{ needs.validate-request.outputs.request_id }}-${{ github.run_id }}
          path: runs/${{ needs.validate-request.outputs.profile }}/
          if-no-files-found: warn
          retention-days: 30
