name: Noise sensitivity primary dt

on:
  push:
    branches:
      - review/noise-sensitivity-primary-dt
    paths:
      - '.github/workflows/noise_sensitivity_primary_dt.yml'
      - 'publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_KL_convergence_v1_0_1/**'
  workflow_dispatch:

jobs:
  noise-sensitivity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: half
            multiplier: '0.5'
          - label: double
            multiplier: '2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: publication/neurothermo_plos_v1_2/environment/requirements-python39-historical.txt

      - name: Install frozen Python environment
        working-directory: publication/neurothermo_plos_v1_2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/requirements-python39-historical.txt
          python --version
          python - <<'PY'
          import numpy, pandas, scipy, numba
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('scipy', scipy.__version__)
          print('numba', numba.__version__)
          PY

      - name: Run noise sensitivity ${{ matrix.label }}
        working-directory: publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_KL_convergence_v1_0_1
        run: |
          python -m kl_convergence.noise_sensitivity_condition \
            --config configs/server_kl_convergence_v1_0_1.yaml \
            --frozen-dir ../../../data/inputs \
            --baseline-dir ../../../data/kl_convergence_v1_0_1 \
            --out results_noise_sensitivity_primary_dt_${{ matrix.label }} \
            --multiplier ${{ matrix.multiplier }}

      - name: Upload noise sensitivity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noise-sensitivity-${{ matrix.label }}
          path: |
            publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_KL_convergence_v1_0_1/results_noise_sensitivity_primary_dt_${{ matrix.label }}/NOISE_SENSITIVITY_CONDITION.json
            publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_KL_convergence_v1_0_1/results_noise_sensitivity_primary_dt_${{ matrix.label }}/condition_vs_baseline.csv
            publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_KL_convergence_v1_0_1/results_noise_sensitivity_primary_dt_${{ matrix.label }}/ensemble_summary.csv
            publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_KL_convergence_v1_0_1/results_noise_sensitivity_primary_dt_${{ matrix.label }}/grid_retention.csv
            publication/neurothermo_plos_v1_2/code/pipelines/NeuroThermo_KL_convergence_v1_0_1/results_noise_sensitivity_primary_dt_${{ matrix.label }}/FAILURES.json
          if-no-files-found: warn
          retention-days: 14
