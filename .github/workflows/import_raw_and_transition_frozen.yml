name: Import raw ABF and transition frozen inputs

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/import_raw_and_transition_frozen.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate and inspect source archive
        shell: bash
        run: |
          set -euo pipefail
          SRC=/home/github-runner/neurothermo_raw_transition_frozen_2026-08-31.tar.gz
          test -r "$SRC"
          echo "SOURCE_ARCHIVE=$SRC" >> "$GITHUB_ENV"
          sha256sum "$SRC"
          tar -tzf "$SRC" > /tmp/raw_transition_contents.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/raw_transition_contents.txt; then
            echo 'Unsafe tar member path detected' >&2
            exit 1
          fi

      - name: Extract raw recordings and exact transition frozen layers
        shell: bash
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          tar -xzf "$SOURCE_ARCHIVE" -C "$TMP"

          ROOT="$GITHUB_WORKSPACE/publication/neurothermo_plos_v1_2"
          rm -rf \
            "$ROOT/data/raw/WT" \
            "$ROOT/data/raw/SCA3" \
            "$ROOT/data/transition_v1_0_frozen" \
            "$ROOT/data/transition_v1_1_frozen" \
            "$ROOT/data/transition_v1_2_frozen" \
            "$ROOT/data/transition_v1_3_frozen"
          mkdir -p "$ROOT/data/raw" "$ROOT/docs" "$ROOT/data/upstream_server_bundle"

          cp -a "$TMP/neurothermo/WT" "$ROOT/data/raw/WT"
          cp -a "$TMP/neurothermo/SCA3" "$ROOT/data/raw/SCA3"
          cp -a "$TMP/neurothermo/v4/neurothermo_transition_ensemble_v1_0/frozen" "$ROOT/data/transition_v1_0_frozen"
          cp -a "$TMP/neurothermo/v4/neurothermo_transition_reprojection_v1_1/frozen" "$ROOT/data/transition_v1_1_frozen"
          cp -a "$TMP/neurothermo/v4/neurothermo_transition_ensemble_v1_2/frozen" "$ROOT/data/transition_v1_2_frozen"
          cp -a "$TMP/neurothermo/v4/neurothermo_transition_ensemble_v1_3/frozen" "$ROOT/data/transition_v1_3_frozen"

          test "$(find "$ROOT/data/raw/WT" -maxdepth 1 -type f -iname '*.abf' | wc -l)" -eq 32
          test "$(find "$ROOT/data/raw/SCA3" -maxdepth 1 -type f -iname '*.abf' | wc -l)" -eq 18
          test "$(find "$ROOT/data/raw" -type f -iname '*.abf' | wc -l)" -eq 50

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('publication/neurothermo_plos_v1_2')
          rows = ['group\tfilename\trelative_path\tsize_bytes\tsha256']
          for group in ('WT','SCA3'):
              for p in sorted((root/'data'/'raw'/group).glob('*.abf')):
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  rows.append(f'{group}\t{p.name}\t{p.relative_to(root)}\t{p.stat().st_size}\t{h}')
          (root/'docs'/'RAW_DATA_MANIFEST.tsv').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY

          sha256sum "$ROOT/data/transition_v1_0_frozen/cell_q75_protocol_anchors.csv" | grep -q '^fe986b58f072ef0f00d252ca799e1f96b6e5b998a9acc3eade6a78a7967ab136 '
          sha256sum "$ROOT/data/transition_v1_2_frozen/cell_q75_protocol_anchors.csv" | grep -q '^fe986b58f072ef0f00d252ca799e1f96b6e5b998a9acc3eade6a78a7967ab136 '
          sha256sum "$ROOT/data/transition_v1_3_frozen/cell_q75_protocol_anchors.csv" | grep -q '^fe986b58f072ef0f00d252ca799e1f96b6e5b998a9acc3eade6a78a7967ab136 '
          sha256sum "$ROOT/data/transition_v1_1_frozen/q75_reference_cells.csv" | grep -q '^d2b56731b8138fbc2106dcdd04d4b3d0cc467f9846e4d86cd9c21ea83b76a6f3 '

          sha256sum "$SOURCE_ARCHIVE" > "$ROOT/data/upstream_server_bundle/RAW_TRANSITION_FROZEN_ARCHIVE_SHA256.txt"
          cp /tmp/raw_transition_contents.txt "$ROOT/data/upstream_server_bundle/RAW_TRANSITION_FROZEN_ARCHIVE_CONTENTS.txt"

          {
            printf 'tree\tfile_count\tbytes\n'
            for d in data/raw/WT data/raw/SCA3 data/transition_v1_0_frozen data/transition_v1_1_frozen data/transition_v1_2_frozen data/transition_v1_3_frozen; do
              n=$(find "$ROOT/$d" -type f | wc -l)
              b=$(find "$ROOT/$d" -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
              printf '%s\t%s\t%s\n' "$d" "$n" "$b"
            done
          } > "$ROOT/data/upstream_server_bundle/RAW_TRANSITION_FROZEN_TREE_SUMMARY.tsv"

      - name: Commit raw and frozen publication inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            publication/neurothermo_plos_v1_2/data/raw \
            publication/neurothermo_plos_v1_2/data/transition_v1_0_frozen \
            publication/neurothermo_plos_v1_2/data/transition_v1_1_frozen \
            publication/neurothermo_plos_v1_2/data/transition_v1_2_frozen \
            publication/neurothermo_plos_v1_2/data/transition_v1_3_frozen \
            publication/neurothermo_plos_v1_2/docs/RAW_DATA_MANIFEST.tsv \
            publication/neurothermo_plos_v1_2/data/upstream_server_bundle/RAW_TRANSITION_FROZEN_*.txt \
            publication/neurothermo_plos_v1_2/data/upstream_server_bundle/RAW_TRANSITION_FROZEN_TREE_SUMMARY.tsv
          git diff --cached --quiet || {
            git commit -m 'Import raw ABF recordings and exact transition frozen inputs'
            git push origin HEAD:publication/plos-v1.2
          }
