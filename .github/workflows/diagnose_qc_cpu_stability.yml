name: Diagnose QC CPU stability

on:
  push:
    branches: [publication/plos-v1.2]
    paths: [.github/workflows/diagnose_qc_cpu_stability.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install exact QC dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r publication/neurothermo_plos_v1_2/requirements.txt
      - name: Prepare calibration
        run: python publication/neurothermo_plos_v1_2/code/prepare_calibration.py
      - name: Test voltage quantization against frozen candidate identities
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          import numpy as np, pandas as pd
          root=Path('publication/neurothermo_plos_v1_2')
          pipe=root/'code/pipelines/NeuroThermo_stage1_qc_fixed'
          spec=importlib.util.spec_from_file_location('qc', pipe/'spike_qc_calibrated.py')
          qc=importlib.util.module_from_spec(spec); spec.loader.exec_module(qc)
          cfg=json.loads((pipe/'config.json').read_text())
          sweeps=[]
          for group,raw in [('WT',root/'data/raw/WT'),('SCA3',root/'data/raw/SCA3')]:
              for path in qc.find_cc(raw): sweeps.extend(qc.load_sweeps(group,path,cfg))
          ref=pd.read_csv(root/'data/calibration/candidate_events_with_predictions.csv')
          cols=['group','cell_id','sweep_index','peak_index']
          refset=set(map(tuple,ref[cols].itertuples(index=False,name=None)))
          print('reference',len(refset))
          for dec in [None,12,11,10,9,8,7,6,5,4]:
              tables=[]
              for s0 in sweeps:
                  s=dict(s0)
                  if dec is not None: s['voltage_mV']=np.round(np.asarray(s['voltage_mV'],float),decimals=dec)
                  f=qc.candidate_features(s,cfg)
                  if len(f): tables.append(f)
              ev=pd.concat(tables,ignore_index=True)
              got=set(map(tuple,ev[cols].itertuples(index=False,name=None)))
              print('decimals',dec,'rows',len(ev),'missing',len(refset-got),'extra',len(got-refset))
          PY
