name: Diagnose QC candidate reproducibility

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/diagnose_qc_candidate_reproducibility.yml
      - publication/neurothermo_plos_v1_2/code/diagnose_qc_candidates.py

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install candidate-extraction environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.13.1 matplotlib==3.9.4 pyabf==2.3.8 scikit-learn==1.6.1
      - name: Prepare frozen calibration reference
        run: python publication/neurothermo_plos_v1_2/code/prepare_calibration.py
      - name: Diagnose candidate extraction replica ${{ matrix.replica }}
        run: python publication/neurothermo_plos_v1_2/code/diagnose_qc_candidates.py
