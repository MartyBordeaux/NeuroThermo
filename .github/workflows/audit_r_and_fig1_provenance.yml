name: Audit Fig1 provenance and optional R environment

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/audit_r_and_fig1_provenance.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Inspect optional R environment
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v Rscript >/dev/null 2>&1; then
            echo 'R_NOT_FOUND_OPTIONAL_RENDERER_ONLY'
          else
            R --version | head -n 2
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install provenance audit dependencies
        run: python -m pip install openpyxl==3.1.5 pyabf==2.3.8 pandas==2.2.3
      - name: Search QC workbook for unresolved WT recording provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          p=Path('publication/neurothermo_plos_v1_2/data/qc/NeuroThermo_benchmark_v2_QC_and_provenance.xlsx')
          wb=load_workbook(p, read_only=True, data_only=True)
          needles=['WT_03','WT_04','WT_06','WT_07','150130','150305','150311','150312']
          print('WORKBOOK_SHEETS', wb.sheetnames)
          for ws in wb.worksheets:
              for row in ws.iter_rows(values_only=True):
                  vals=['' if v is None else str(v) for v in row]
                  text=' | '.join(vals)
                  hits=[n for n in needles if n in text]
                  if hits:
                      print('WORKBOOK_MATCH', ws.title, hits, text[:2500])
          PY
      - name: Validate unresolved WT labels from raw ABF header dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import pyabf
          root=Path('publication/neurothermo_plos_v1_2')
          fig=pd.read_csv(root/'data/figure_source/fig1_endpoint_cells.csv')
          for cell in ['WT_03','WT_04','WT_06','WT_07']:
              nn=cell.split('_')[-1]
              abf=pyabf.ABF(str(root/'data/raw/WT'/f'cc_{nn}.abf'), loadData=False)
              derived=f"WT_{abf.abfDateTime:%y%m%d}"
              expected=fig.loc[fig.cell_id.eq(cell),'animal_id'].iloc[0]
              print(cell, 'figure=', expected, 'abf_header=', derived)
              assert derived == expected
          print('FIG1_ABF_DATE_LABELS_PASS')
          PY
