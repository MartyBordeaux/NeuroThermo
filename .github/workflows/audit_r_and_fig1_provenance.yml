name: Audit R environment and Fig1 provenance

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/audit_r_and_fig1_provenance.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Inspect R environment
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v Rscript >/dev/null 2>&1; then
            echo 'R_NOT_FOUND'
          else
            R --version | head -n 2
            Rscript - <<'RS'
          cat('R_VERSION=', R.version.string, '\n', sep='')
          pkgs <- c('ggplot2','dplyr','tidyr','readr','patchwork','scales')
          for (p in pkgs) {
            if (requireNamespace(p, quietly=TRUE)) {
              cat(p, '=', as.character(packageVersion(p)), '\n', sep='')
            } else {
              cat(p, '=MISSING\n', sep='')
            }
          }
          cat('PLATFORM=', R.version$platform, '\n', sep='')
          cat('REPOS=', paste(getOption('repos'), collapse=';'), '\n', sep='')
          RS
          fi
      - name: Search QC workbook for unresolved WT recording provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          p=Path('publication/neurothermo_plos_v1_2/data/qc/NeuroThermo_benchmark_v2_QC_and_provenance.xlsx')
          wb=load_workbook(p, read_only=True, data_only=True)
          needles=['WT_03','WT_04','WT_06','WT_07','150130','150305','150311','150312']
          print('WORKBOOK_SHEETS', wb.sheetnames)
          for ws in wb.worksheets:
              print('SHEET', ws.title, 'rows', ws.max_row, 'cols', ws.max_column)
              for row in ws.iter_rows(values_only=True):
                  vals=['' if v is None else str(v) for v in row]
                  text=' | '.join(vals)
                  hits=[n for n in needles if n in text]
                  if hits:
                      print('MATCH', ws.title, hits, text[:4000])
          PY
