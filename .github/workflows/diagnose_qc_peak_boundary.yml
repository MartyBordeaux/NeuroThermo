name: Diagnose QC peak boundary

on:
  push:
    branches:
      - publication/plos-v1.2
    paths:
      - .github/workflows/diagnose_qc_peak_boundary.yml
      - publication/neurothermo_plos_v1_2/code/diagnose_qc_peak_boundary.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install exact QC dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r publication/neurothermo_plos_v1_2/requirements.txt
      - name: Prepare frozen calibration reference
        run: python publication/neurothermo_plos_v1_2/code/prepare_calibration.py
      - name: Diagnose threshold-boundary peaks
        run: python publication/neurothermo_plos_v1_2/code/diagnose_qc_peak_boundary.py
